[project]
name = "untunnel-tools"
version = "0.1.0"
description = "Development and evaluation tools for the audio restoration project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "soundfile==0.14.0",
    "soxr==1.1.0",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[dependency-groups]
eval = [
    "sounddevice==0.5.6",
    "onnxruntime==1.31.1",
    "mlx-whisper==0.4.3; sys_platform == 'darwin'",
    "jiwer==4.0.0",
    "pesq==0.0.4",
    "pystoi==0.4.1",
    "speechbrain==1.1.2",
    "torch==2.15.0",
    "torchaudio==2.11.1",
    "matplotlib==3.11.2",
    "rich==15.0.0",
    "torchcodec==0.17.0",
]
site = [
    "pytest==9.2.0",
    "pytest-playwright==0.10.0",
    "playwright==1.64.1",
    "axe-playwright-python==0.1.8",
]
dev = [
    "ruff==0.17.4",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "hypothesis==6.170.15",
    "pre-commit==4.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213", "COM812", "ISC001", "CPY001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004"]

[tool.pyright]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
